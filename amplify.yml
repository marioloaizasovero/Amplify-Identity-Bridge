version: 1
backend:
  phases:
    build:
      commands:
        - npm install --include=optional --no-audit --cache .npm --prefer-offline
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    build:
      commands:
        - env | grep -e AWS_REGION -e BRIDGE_BASE_URL -e COGNITO_DOMAIN -e COGNITO_CLIENT_ID -e COGNITO_REDIRECT_URI -e COGNITO_SCOPES -e BRIDGE_SESSION_TTL_SECONDS -e ENABLE_COGNITO_DEBUG -e ENABLE_VTEX_CREDENTIAL_GENERATOR -e LOG_LEVEL -e VTEX_CLIENT_ID -e VTEX_CLIENT_SECRET -e VTEX_ALLOWED_REDIRECT_URI -e VTEX_STORE_LOGIN_URL -e VTEX_OAUTH_PROVIDER -e VTEX_RETURN_URL -e ENABLE_VTEX_SIMULATOR > .env.production
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .next/cache/**/*
      - .npm/**/*
