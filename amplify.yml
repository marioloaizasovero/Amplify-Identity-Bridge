version: 1
backend:
  phases:
    build:
      commands:
        - npm ci --cache .npm --prefer-offline
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    build:
      commands:
        - env | grep -e AWS_REGION -e BRIDGE_BASE_URL -e COGNITO_DOMAIN -e COGNITO_USER_POOL_ID -e COGNITO_CLIENT_ID -e COGNITO_REDIRECT_URI -e COGNITO_SCOPES -e COGNITO_STATE_TTL_SECONDS -e BRIDGE_SESSION_TTL_SECONDS >> .env.production
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .next/cache/**/*
      - .npm/**/*
      - node_modules/**/*
